<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Popular · ReelRooms</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">

<nav th:replace="~{fragments/navbar :: navbar}"></nav>

<main class="container py-4" style="max-width: 860px;">
    <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
        <div>
            <h1 class="h3 mb-1">Popular</h1>
            <p class="text-muted small mb-0">
                posts ranked by engagement before the For You quiet picks are added
            </p>
        </div>

        <a th:href="@{/for-you}" class="btn btn-outline-primary btn-sm">
            For You
        </a>
    </div>

    <!-- no popular posts yet -->
    <div th:if="${#lists.isEmpty(posts)}" class="alert alert-light border">
        No posts yet.
    </div>

    <div th:each="post : ${posts}" class="card border-0 shadow-sm mb-4">
        <div class="row g-0">
            <div class="col-md-3">
                <img th:if="${post.movie.posterUrl != null}" th:src="${post.movie.posterUrl}"
                     class="img-fluid rounded-start" alt="poster"
                     onerror="this.src='/img/no-poster.svg'; this.onerror=null;"
                     style="width: 100%; height: 100%; min-height: 260px; object-fit: cover;">
                <img th:unless="${post.movie.posterUrl != null}"
                     th:src="@{/img/no-poster.svg}" alt="No poster available"
                     class="img-fluid rounded-start"
                     style="width: 100%; height: 100%; min-height: 260px; object-fit: cover;">
            </div>

            <div class="col-md-9">
                <div class="card-body">
                    <div class="d-flex justify-content-between align-items-start gap-2 mb-1">
                        <div>
                            <h2 class="h5 mb-1" th:text="${post.movie.title}">Movie title</h2>
                            <p class="text-muted small mb-2">
                                posted by <strong th:text="${post.user.username}">user</strong>
                                <span th:if="${post.createdAt != null}">
                                    · <span th:text="${#temporals.format(post.createdAt, 'd MMM yyyy, HH:mm')}">date</span>
                                </span>
                            </p>
                        </div>

                        <span class="badge bg-primary">
                            <span th:text="${commentCounts.get(post.id) ?: 0}">0</span>
                            comments
                        </span>
                    </div>

                    <p class="mb-3" style="white-space: pre-wrap;" th:text="${post.content}">
                        post content
                    </p>

                    <!-- top comment preview -->
                    <div th:if="${topComments.get(post.id) != null}"
                         class="border-start ps-3 small text-muted mb-3">
                        <strong th:text="${topComments.get(post.id).authorUsername()}">user</strong>:
                        <span th:text="${#strings.abbreviate(topComments.get(post.id).content(), 160)}">
                            comment preview
                        </span>
                    </div>

                    <a th:href="@{'/posts/' + ${post.id}}" class="btn btn-outline-primary btn-sm">
                        Open thread
                    </a>
                </div>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/footer :: footer}"></footer>

</body>
</html>
