<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Admin log · ReelRooms</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">

<nav th:replace="~{fragments/navbar :: navbar}"></nav>

<main class="container py-4" style="max-width: 960px;">
    <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
        <div>
            <h1 class="h3 mb-1">Admin log</h1>
            <p class="text-muted small mb-0">latest moderation actions</p>
        </div>

        <!-- admin links -->
        <div class="d-flex gap-2">
            <a th:href="@{/admin/metrics}" class="btn btn-outline-primary btn-sm">
                Feed metrics
            </a>
            <a th:href="@{/admin/perf}" class="btn btn-outline-primary btn-sm">
                Performance
            </a>
        </div>
    </div>

    <!-- empty log state -->
    <div th:if="${#lists.isEmpty(actions)}" class="alert alert-light border">
        No moderation actions have been logged yet.
    </div>

    <div th:unless="${#lists.isEmpty(actions)}" class="card border-0 shadow-sm">
        <div class="table-responsive">
            <table class="table table-sm mb-0 align-middle">
                <thead class="table-light">
                <tr>
                    <th class="small">Time</th>
                    <th class="small">Admin</th>
                    <th class="small">Action</th>
                    <th class="small">Content</th>
                    <th class="small">Reason</th>
                </tr>
                </thead>
                <tbody>
                <!-- one row per audit entry -->
                <tr th:each="a : ${actions}">
                    <td class="small text-muted"
                        th:text="${#temporals.format(a.createdAt, 'd MMM yyyy HH:mm')}">
                        1 Jan 2026 12:00
                    </td>

                    <td class="small">
                        <span th:if="${a.admin != null}" th:text="${a.admin.username}">
                            admin
                        </span>
                        <span th:unless="${a.admin != null}" class="text-muted fst-italic">
                            deleted user
                        </span>
                    </td>

                    <td class="small">
                        <code th:text="${a.actionType}">DELETE_POST</code>
                    </td>

                    <td class="small">
                        <span class="text-muted" th:text="${a.targetType}">POST</span>
                        <span class="text-muted">#</span><span th:text="${a.targetId}">42</span>

                        <div th:if="${a.targetSummary != null}"
                             class="text-muted fst-italic mt-1"
                             th:text="${#strings.abbreviate(a.targetSummary, 120)}">
                            removed content preview
                        </div>
                    </td>

                    <td class="small" th:text="${a.reason}">
                        reason
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/footer :: footer}"></footer>

</body>
</html>
